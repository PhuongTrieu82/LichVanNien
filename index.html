<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7a1f1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Lịch Vạn Niên</title>
<style>
:root{--red:#8e1b1b;--gold:#f0c75e;--glass:rgba(22,9,9,.62);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#2a0d0d;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font-family:inherit}
#bg1,#bg2{position:fixed;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s ease}
#bg1.show,#bg2.show{opacity:1}
#base{position:fixed;inset:0;background:linear-gradient(160deg,#7a1f1f,#2a0d0d 60%,#12306b)}
#shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.22) 30%,rgba(0,0,0,.38) 60%,rgba(0,0,0,.78) 100%);pointer-events:none}
#sigwrap{position:fixed;z-index:4;top:calc(env(safe-area-inset-top) + 10px);right:14px;pointer-events:none;opacity:.92}
.sig{height:22px;width:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}
#scroll{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#page{max-width:560px;margin:0 auto;padding:0 14px;transform-origin:left center}
#page.flipN{animation:flipN .45s ease both}
#page.flipP{animation:flipP .45s ease both;transform-origin:right center}
@keyframes flipN{from{opacity:0;transform:perspective(1000px) rotateY(32deg) translateX(40px)}to{opacity:1;transform:none}}
@keyframes flipP{from{opacity:0;transform:perspective(1000px) rotateY(-32deg) translateX(-40px)}to{opacity:1;transform:none}}
.hero{min-height:44vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-shadow:0 2px 16px rgba(0,0,0,.8);padding:34px 0 10px}
.wd{font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.big{font-size:min(38vw,170px);line-height:1;font-weight:800;margin:4px 0;font-family:Georgia,"Times New Roman",serif}
.my{font-size:20px;font-weight:500}
.lunar{margin-top:10px;font-size:17px;background:rgba(142,27,27,.82);border:1px solid rgba(240,199,94,.55);padding:7px 16px;border-radius:999px;text-shadow:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{font-size:13.5px;padding:5px 12px;border-radius:999px;text-shadow:none;font-weight:600}
.chip.hd{background:var(--gold);color:#4a2200}
.chip.bd{background:#222;color:#ddd;border:1px solid #666}
.chip.ev{background:rgba(255,255,255,.2);border:1px solid var(--line)}
.chip.off{background:#c0392b;border-color:#ff9a8a}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.cc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.cc div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 4px}
.cc small{display:block;font-size:11.5px;opacity:.7;margin-bottom:3px}
.cc b{font-size:16px}
.tiet{margin-top:10px;font-size:14px;opacity:.9}
.hours{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.hr{border-radius:12px;padding:8px 4px;text-align:center;background:rgba(255,255,255,.06);opacity:.55}
.hr b{display:block;font-size:15px}
.hr small{font-size:11.5px}
.hr.good{opacity:1;background:linear-gradient(135deg,#f6d77a,#d99a1e);color:#3d1d00}
.hr.now{outline:2px solid #fff;outline-offset:1px}
/* lịch tháng */
.mh2{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mh2 b{font-size:16px;text-align:center;flex:1}
.mh2 small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:1px}
.mh2 button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:20px;line-height:1}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dow{font-size:12px;opacity:.7;margin-bottom:4px}
.dow div:nth-child(6),.dow div:nth-child(7){color:#ffb4b4}
.cell{position:relative;border:0;background:rgba(255,255,255,.06);color:#fff;border-radius:10px;padding:5px 0 3px;min-height:48px}
.cell b{display:block;font-size:16px;font-weight:600}
.cell i{display:block;font-style:normal;font-size:10.5px;opacity:.7}
.cell.r i{color:#ff9a9a;opacity:1}
.cell.we b{color:#ffb4b4}
.cell.off b{color:#ff6b5e}
.cell.hol::after{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.cell.sel{background:var(--gold);color:#3d1d00}.cell.sel b,.cell.sel i{color:#3d1d00}
.cell.td{outline:2px solid #fff;outline-offset:-1px}
.cell.empty{background:none;pointer-events:none}
.legend{margin-top:8px;font-size:11.5px;opacity:.7;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--gold)}
.legend span.o::before{background:#ff6b5e}.legend span.n::before{display:none}
/* danh sách lễ */
ul.ev{list-style:none;margin:0;padding:0}
ul.ev li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
ul.ev li:first-child{border-top:0}
.ed{min-width:48px;text-align:center;background:rgba(255,255,255,.1);border-radius:10px;padding:5px 0;font-weight:700;font-size:15px;line-height:1.1}
.ed small{display:block;font-weight:400;font-size:10.5px;opacity:.7}
.en{flex:1;font-size:14.5px;line-height:1.3}
.en em{display:block;font-style:normal;font-size:12px;opacity:.65}
.en.t{opacity:.75}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#c0392b;font-weight:600;white-space:nowrap}
.tag.g{background:rgba(255,255,255,.14);font-weight:500}
.none{font-size:13.5px;opacity:.7;padding:4px 0}
/* danh ngôn */
.qt{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.qt button{border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px}
.qt button.on{background:var(--gold);color:#3d1d00;border-color:var(--gold);font-weight:700}
.qt .sp{flex:1}
.qt #qnext{width:34px;padding:5px 0;font-size:16px}
.qtext{text-align:center;padding:14px 10px 8px;margin:6px 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.6)}
.qs{margin-top:6px;font-size:11.5px;opacity:.55}
.q{font-size:20px;line-height:1.5;font-family:Georgia,serif}
.qen{margin-top:8px;font-size:13.5px;opacity:.75;font-style:italic}
.qa{margin-top:8px;font-size:13px;color:var(--gold)}
.small{font-size:13px;opacity:.85;line-height:1.5}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,0))}
#bar button{flex:1;max-width:110px;border:1px solid var(--line);background:rgba(24,10,10,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border-radius:14px;padding:10px 4px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
#bar button span{font-size:20px;line-height:1}
#bar button:active{transform:scale(.95)}
#modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center}
#modal.open{display:flex}
#sheet{width:100%;max-width:560px;background:#241010;border-radius:0 0 22px 22px;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;border:1px solid var(--line);animation:drop .3s ease both}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
#pull{position:fixed;z-index:4;top:env(safe-area-inset-top);left:50%;transform:translateX(-50%);width:84px;height:26px;border:0;background:none;padding:0}
#pull i{display:block;width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.55);margin:9px auto 0;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mh button,.mh input{background:rgba(255,255,255,.1);border:1px solid var(--line);color:#fff;border-radius:10px;padding:8px 12px;font-size:15px;color-scheme:dark}
.mh .t{font-weight:700;font-size:17px;flex:1;text-align:center}
.close{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:0;background:var(--red);color:#fff;font-size:15px;font-weight:600}
</style>
</head>

<!-- ============ LÕI TÍNH LỊCH (thuật toán Hồ Ngọc Đức) ============ -->
<script id="core">
const TZ = 7;
const CAN = ["Giáp","Ất","Bính","Đinh","Mậu","Kỷ","Canh","Tân","Nhâm","Quý"];
const CHI = ["Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi","Thân","Dậu","Tuất","Hợi"];

function jdFromDate(dd, mm, yy){
  const a = Math.floor((14 - mm) / 12), y = yy + 4800 - a, m = mm + 12 * a - 3;
  return dd + Math.floor((153 * m + 2) / 5) + 365 * y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) - 32045;
}
function newMoon(k){
  const T = k / 1236.85, T2 = T * T, T3 = T2 * T, dr = Math.PI / 180;
  let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
  Jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);
  const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
  const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
  const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;
  let C1 = (0.1734 - 0.000393 * T) * Math.sin(M * dr) + 0.0021 * Math.sin(2 * dr * M);
  C1 = C1 - 0.4068 * Math.sin(Mpr * dr) + 0.0161 * Math.sin(dr * 2 * Mpr);
  C1 = C1 - 0.0004 * Math.sin(dr * 3 * Mpr);
  C1 = C1 + 0.0104 * Math.sin(dr * 2 * F) - 0.0051 * Math.sin(dr * (M + Mpr));
  C1 = C1 - 0.0074 * Math.sin(dr * (M - Mpr)) + 0.0004 * Math.sin(dr * (2 * F + M));
  C1 = C1 - 0.0004 * Math.sin(dr * (2 * F - M)) - 0.0006 * Math.sin(dr * (2 * F + Mpr));
  C1 += 0.0010 * Math.sin(dr * (2 * F - Mpr)) + 0.0005 * Math.sin(dr * (2 * Mpr + M));
  const dt = T < -11 ? 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3
                     : -0.000278 + 0.000265 * T + 0.000262 * T2;
  return Jd1 + C1 - dt;
}
function newMoonDay(k){ return Math.floor(newMoon(k) + 0.5 + TZ / 24); }
// Kinh độ Mặt Trời (radian, 0..2π) tại 0h địa phương của ngày JDN
function sunLongRad(jdn){
  const T = (jdn - 2451545.5 - TZ / 24) / 36525, T2 = T * T, dr = Math.PI / 180;
  const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
  const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;
  const DL = (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M) + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M) + 0.000290 * Math.sin(dr * 3 * M);
  const L = (L0 + DL) * dr;
  return L - Math.PI * 2 * Math.floor(L / (Math.PI * 2));
}
const sunSector = jdn => Math.floor(sunLongRad(jdn) / Math.PI * 6);
function lunarMonth11(yy){
  const off = jdFromDate(31, 12, yy) - 2415021;
  const k = Math.floor(off / 29.530588853);
  let nm = newMoonDay(k);
  if (sunSector(nm) >= 9) nm = newMoonDay(k - 1);
  return nm;
}
function leapMonthOffset(a11){
  const k = Math.floor((a11 - 2415021.076998695) / 29.530588853 + 0.5);
  let last, i = 1, arc = sunSector(newMoonDay(k + i));
  do { last = arc; i++; arc = sunSector(newMoonDay(k + i)); } while (arc !== last && i < 14);
  return i - 1;
}
const _lc = new Map();
function solar2lunar(dd, mm, yy){
  const jd = jdFromDate(dd, mm, yy);
  if (_lc.has(jd)) return _lc.get(jd);
  const k = Math.floor((jd - 2415021.076998695) / 29.530588853);
  let monthStart = newMoonDay(k + 1);
  if (monthStart > jd) monthStart = newMoonDay(k);
  let a11 = lunarMonth11(yy), b11 = a11, ly;
  if (a11 >= monthStart){ ly = yy; a11 = lunarMonth11(yy - 1); }
  else { ly = yy + 1; b11 = lunarMonth11(yy + 1); }

}

const SOLAR_EV = {"1/1":["Tết Dương lịch",1],"3/2":["Thành lập Đảng Cộng sản Việt Nam"],"14/2":["Lễ tình nhân Valentine"],"27/2":["Ngày Thầy thuốc Việt Nam"],"8/3":["Quốc tế Phụ nữ"],"26/3":["Thành lập Đoàn TNCS Hồ Chí Minh"],"30/4":["Giải phóng miền Nam",1],"1/5":["Quốc tế Lao động",1],"7/5":["Chiến thắng Điện Biên Phủ"],"19/5":["Sinh nhật Chủ tịch Hồ Chí Minh"],"1/6":["Quốc tế Thiếu nhi"],"21/6":["Ngày Báo chí Cách mạng Việt Nam"],"28/6":["Ngày Gia đình Việt Nam"],"27/7":["Ngày Thương binh Liệt sĩ"],"19/8":["Cách mạng Tháng Tám"],"2/9":["Quốc khánh",1],"10/10":["Giải phóng Thủ đô"],"13/10":["Ngày Doanh nhân Việt Nam"],"20/10":["Ngày Phụ nữ Việt Nam"],"31/10":["Halloween"],"9/11":["Ngày Pháp luật Việt Nam"],"20/11":["Ngày Nhà giáo Việt Nam"],"23/11":["Thành lập Hội Chữ thập đỏ Việt Nam"],"19/12":["Toàn quốc kháng chiến"],"22/12":["Thành lập Quân đội Nhân dân Việt Nam"],"24/12":["Đêm Giáng sinh"],"25/12":["Lễ Giáng sinh"]};
const LUNAR_EV = {"1/1":["Tết Nguyên Đán",1],"2/1":["Mùng 2 Tết",1],"3/1":["Mùng 3 Tết",1],"10/1":["Vía Thần Tài"],"15/1":["Rằm tháng Giêng (Nguyên tiêu)"],"3/3":["Tết Hàn thực"],"10/3":["Giỗ Tổ Hùng Vương",1],"15/4":["Lễ Phật đản"],"5/5":["Tết Đoan Ngọ"],"7/7":["Lễ Thất tịch"],"15/7":["Lễ Vu Lan"],"15/8":["Tết Trung thu"],"9/9":["Tết Trùng Cửu"],"10/10":["Tết Thường Tân"],"15/10":["Tết Hạ nguyên"],"23/12":["Ông Công Ông Táo"]};
/* Trả về mảng {n: tên, off: nghỉ lễ, g: chung chung (mùng 1/rằm), t: 'tiet' nếu là tiết khí} */
function suKien(dd, mm, yy, L){
  const ev = [], dow = new Date(yy, mm - 1, dd, 12).getDay();
  const s = SOLAR_EV[dd + "/" + mm]; if (s) ev.push({ n: s[0], off: !!s[1] });
  if (mm === 5 && dow === 0 && dd >= 8 && dd <= 14) ev.push({ n: "Ngày của Mẹ" });
  if (mm === 6 && dow === 0 && dd >= 15 && dd <= 21) ev.push({ n: "Ngày của Cha" });
  if (!L.leap){
    const l = LUNAR_EV[L.day + "/" + L.month];
    if (l) ev.push({ n: l[0], off: !!l[1] });
    else if (L.day === 1) ev.push({ n: "Mùng 1 âm lịch", g: 1 });
    else if (L.day === 15) ev.push({ n: "Ngày Rằm", g: 1 });
  }
  const nx = new Date(yy, mm - 1, dd + 1, 12), N = solar2lunar(nx.getDate(), nx.getMonth() + 1, nx.getFullYear());
  if (N.day === 1 && N.month === 1 && !N.leap) ev.push({ n: "Giao thừa", off: true });
  const tk = tietKhi(L.jd); if (tk.start) ev.push({ n: "Tiết " + tk.name, t: "tiet" });
  return ev;
}

  h += '</div></section>';
  h += '<div class="qtext" id="qbox"><div class="q" id="qv"></div><div class="qen" id="qe"></div><div class="qa" id="qa"></div><div class="qs" id="qs"></div></div>';
  h += '<div class="card"><h3>Can chi</h3><div class="cc"><div><small>Ngày</small><b>' + canChiDay(jd) + '</b></div><div><small>Tháng</small><b>' + canChiMonth(L.year, L.month) + '</b></div><div><small>Năm</small><b>' + canChiYear(L.year) + '</b></div></div>' +
       '<div class="tiet">🌿 ' + (tk.start ? 'Hôm nay vào tiết <b>' + tk.name + '</b>' : 'Đang trong tiết <b>' + tk.name + '</b>') + '</div></div>';
  const nowIdx = Math.floor(((new Date().getHours() + 1) % 24) / 2);
  h += '<div class="card"><h3>Giờ Hoàng đạo</h3><div class="hours">';
  gioHoangDao(jd).forEach((g, i) => h += '<div class="hr' + (g.good ? ' good' : '') + (isToday && i === nowIdx ? ' now' : '') + '"><b>' + g.chi + '</b><small>' + g.time + '</small></div>');
  h += '</div><div class="small" style="margin-top:8px">Ô vàng là giờ tốt (hoàng đạo)' + (isToday ? '; ô viền trắng là giờ hiện tại.' : '.') + '</div></div>';
  h += '<div class="card" id="mev"></div>';
  const up = renderUpcoming();
  h += '<div class="card"><h3>Sắp tới</h3><ul class="ev">' + (up || '<li class="none">Chưa có dữ liệu.</li>') + '</ul><div class="small" style="margin-top:8px;opacity:.6">Ngày nghỉ lễ thực tế mỗi năm có thể do Chính phủ điều chỉnh.</div></div>';
  h += '<div class="small" style="text-align:center;margin:14px 0 6px;opacity:.6">Chạm vào danh ngôn để đổi câu khác · vuốt trái / phải để lật ngày · kéo từ trên xuống để mở lịch tháng</div>';
  const page = $("page");
  page.innerHTML = h;
  renderMonth();
  page.classList.remove("flipN", "flipP"); void page.offsetWidth;
  if (dir) page.classList.add(dir > 0 ? "flipN" : "flipP");
  $("scroll").scrollTop = 0;
  document.title = "Lịch Vạn Niên – " + dd + "/" + mm + "/" + yy;
  $("bToday").style.opacity = isToday ? .55 : 1;
  setBg(); loadQuote();
}
function go(d, dir){
  const nd = mk(d.getFullYear(), d.getMonth(), d.getDate());
  if (dir === undefined) dir = nd > cur ? 1 : nd < cur ? -1 : 0;
  cur = nd; render(dir);
}
const step = n => go(mk(cur.getFullYear(), cur.getMonth(), cur.getDate() + n), n);
const goToday = () => { const n = new Date(); todayKey = keyOf(n); go(mk(n.getFullYear(), n.getMonth(), n.getDate())); };

$("bPrev").onclick = () => step(-1);
$("bNext").onclick = () => step(1);
$("bToday").onclick = goToday;
$("bImg").onclick = () => { const k = "bump-" + keyOf(cur); store.set(k, String((+store.get(k) || 0) + 1)); setBg(); };

/* ---------- Vuốt & phím mũi tên ---------- */
let sx = 0, sy = 0, st = 0;
const sc = $("scroll");
let atTop = false;
sc.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); atTop = sc.scrollTop <= 2; }, { passive: true });
sc.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (atTop && dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5){ openPicker(); return; }
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - st < 700) step(dx < 0 ? 1 : -1);
}, { passive: true });
document.addEventListener("keydown", e => {
  if ($("modal").classList.contains("open")) return;
  if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
});

/* ---------- Chọn ngày (cửa sổ) ---------- */
let gY = 0, gM = 0;
function buildGrid(){ $("gTitle").textContent = "Tháng " + (gM + 1) + " / " + gY; $("grid").innerHTML = cellsHTML(gY, gM); }
function openPicker(){ gY = cur.getFullYear(); gM = cur.getMonth(); $("dpick").value = keyOf(cur); buildGrid(); $("modal").classList.add("open"); }
const closePicker = () => $("modal").classList.remove("open");
const gMove = n => { const d = mk(gY, gM + n, 1); gY = d.getFullYear(); gM = d.getMonth(); buildGrid(); };
$("bPick").onclick = openPicker;
$("pull").onclick = openPicker;
$("gClose").onclick = closePicker;
let cy = 0;
$("sheet").addEventListener("touchstart", e => { cy = e.touches[0].clientY; }, { passive: true });
$("sheet").addEventListener("touchend", e => { if (e.changedTouches[0].clientY - cy < -70) closePicker(); }, { passive: true });
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closePicker(); });
$("gPrev").onclick = () => gMove(-1); $("gNext").onclick = () => gMove(1);
$("gPrevY").onclick = () => gMove(-12); $("gNextY").onclick = () => gMove(12);
$("dgo").onclick = () => {
  const v = $("dpick").value; if (!v) return;
  const p = v.split("-").map(Number); closePicker(); go(mk(p[0], p[1] - 1, p[2]));
};

/* ---------- Bấm vào ngày / chuyển tháng / đổi danh ngôn ---------- */
document.addEventListener("click", e => {
  const c = e.target.closest("[data-ymd]");
  if (c){ const p = c.dataset.ymd.split("-").map(Number); closePicker(); go(mk(p[0], p[1] - 1, p[2])); return; }
  const m = e.target.closest("[data-m]");
  if (m){ moveMonth(+m.dataset.m); return; }
  if (e.target.closest("#qbox")) loadQuote();
});

/* ---------- Tự lật sang ngày mới lúc 0h, cập nhật giờ hiện tại ---------- */
setInterval(() => {
  const n = new Date(), nk = keyOf(n);
  if (nk !== todayKey){
    const wasViewingToday = keyOf(cur) === todayKey;
    todayKey = nk;
    if (wasViewingToday) go(mk(n.getFullYear(), n.getMonth(), n.getDate()), 1);
  } else if (keyOf(cur) === todayKey){
    const idx = Math.floor(((n.getHours() + 1) % 24) / 2);
    document.querySelectorAll(".hr").forEach((c, i) => c.classList.toggle("now", i === idx));
  }
}, 30000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && keyOf(new Date()) !== todayKey) goToday();
});

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
render(0);
</script>
</body>
</html>
